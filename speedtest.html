<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Test</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --line:#ddd; --acc:#0b6b3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --mut:#aaa; --line:#333; --acc:#4cc38a; } }
  body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:14px; max-width:520px; margin:auto; }
  h1 { font-size:18px; margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:10px; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  button { margin-top:12px; padding:12px 16px; font-size:15px; border:0; border-radius:8px; background:var(--acc); color:#fff; width:100%; }
  button:disabled { opacity:.5; }
  pre { white-space:pre-wrap; word-break:break-word; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; min-height:60px; }
  .note { font-size:12px; color:var(--mut); }
</style>
</head>
<body>
<h1>Speed Test: Apps Script bamuqabil Supabase</h1>
<p class="note">Neeche Supabase ki do cheezein paste karein (Project Settings, API se). Test ~1 minute leta hai. Isay usi phone/internet se chalayein jis se zimmedar portal chalate hain.</p>

<label>Supabase Project URL (https://xxxx.supabase.co)</label>
<input id="sbUrl" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocomplete="off">
<label>Supabase anon / publishable key</label>
<input id="sbKey" placeholder="eyJ... ya sb_publishable_..." autocapitalize="off" autocomplete="off">

<button id="go">Test shuru karein</button>
<p class="note" id="status"></p>
<pre id="out">Nateeja yahan aayega.</pre>
<button id="copy" style="background:#555;display:none">Nateeja copy karein</button>

<script>
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbycQm0RGb8lGeGe2LmE_3k7RyKUtEDBWK2fwClrb488bwfeinxpBLuuSjESNVnXONqkQA/exec";
const API_KEY = "Sf9k2mQz7xLp4vNw8eRt3yUiH6dGbCjA";
const RUNS = 8;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function stats(a) {
  if (!a.length) return 'koi nateeja nahi';
  const s = [...a].sort((x, y) => x - y);
  const avg = Math.round(a.reduce((p, c) => p + c, 0) / a.length);
  const med = Math.round(s[Math.floor(s.length / 2)]);
  return 'median ' + med + ' ms | average ' + avg + ' ms | sab se tez ' + Math.round(s[0]) + ' | sab se dheema ' + Math.round(s[s.length - 1]);
}
async function timeIt(fn) {
  const t = performance.now();
  await fn();
  return performance.now() - t;
}
async function series(label, fn, log) {
  const times = [];
  try { await fn(); } catch (e) { log(label + ': pehli call nakam: ' + e.message); return times; } // garam karne wali call, shumar nahi
  for (let i = 0; i < RUNS; i++) {
    $('status').textContent = label + ' ' + (i + 1) + '/' + RUNS + ' ...';
    try { times.push(await timeIt(fn)); } catch (e) { log(label + ': call nakam: ' + e.message); }
    await sleep(250);
  }
  return times;
}

const appsPing = async () => {
  const r = await fetch(BACKEND_URL + '?key=' + API_KEY + '&action=ping&col=x&_=' + Date.now());
  const j = await r.json(); if (!j.ok) throw new Error(JSON.stringify(j).slice(0, 80));
};
const appsRead = async () => {
  const r = await fetch(BACKEND_URL + '?key=' + API_KEY + '&action=get&col=config&id=global&_=' + Date.now());
  const j = await r.json(); if (j.error) throw new Error(j.error);
};

function sbHeaders(key, extra) {
  const h = { apikey: key, 'Content-Type': 'application/json' };
  if (!key.startsWith('sb_')) h.Authorization = 'Bearer ' + key; // naye "publishable" key ke saath Authorization nahi bhejte
  return Object.assign(h, extra || {});
}

$('go').onclick = async () => {
  const url = $('sbUrl').value.trim().replace(/\/+$/, '');
  const key = $('sbKey').value.trim();
  if (!/^https:\/\/.+\.supabase\.co$/.test(url) || key.length < 20) { $('status').textContent = 'URL ya key theek nahi lagti.'; return; }
  $('go').disabled = true; $('copy').style.display = 'none';
  const lines = [];
  const log = m => lines.push(m);
  const rest = url + '/rest/v1/speedtest';

  const sbRead = async () => {
    const r = await fetch(rest + '?id=eq.row1&select=id,data', { headers: sbHeaders(key) });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 80));
    await r.json();
  };
  const sbWrite = async () => {
    const r = await fetch(rest, {
      method: 'POST',
      headers: sbHeaders(key, { Prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ id: 'row1', data: { t: Date.now(), pad: 'x'.repeat(2000) } })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 80));
  };

  const a1 = await series('Apps Script ping', appsPing, log);
  const a2 = await series('Apps Script asli read', appsRead, log);
  const s1 = await series('Supabase read', sbRead, log);
  const s2 = await series('Supabase write', sbWrite, log);

  const out = [
    'Apps Script ping (sirf raasta): ' + stats(a1),
    'Apps Script asli read: ' + stats(a2),
    'Supabase read: ' + stats(s1),
    'Supabase write: ' + stats(s2),
    ...lines,
    '(Apps Script ka save ~3300-3700 ms, din kholna ~1400-2400 ms, portal ke ?speed=1 panel se)'
  ].join('\n\n');
  $('out').textContent = out;
  $('status').textContent = 'Test mukammal.';
  $('go').disabled = false; $('copy').style.display = 'block';
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('out').textContent); $('status').textContent = 'Copy ho gaya.'; }
  catch (e) { $('status').textContent = 'Copy nahi hua: nateeja khud select karke copy karein.'; }
};
</script>
</body>
</html>
